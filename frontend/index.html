<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aurelius Protocol | Institutional Yield Infrastructure</title>
    <style>
      :root {
        --bg-primary: #050505;
        --bg-secondary: #0a0a0a;
        --text-primary: #e5e5e5;
        --text-secondary: #888888;
        --accent-gold: #d4af37;
        --accent-gold-dim: #997a00;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        background: var(--bg-primary);
        color: var(--text-primary);
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
      }
      #canvas-bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
      }
      .container {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 2rem;
        text-align: center;
      }
      h1 {
        font-size: clamp(2.5rem, 5vw, 4.5rem);
        font-weight: 300;
        letter-spacing: -0.02em;
        margin-bottom: 1rem;
        background: linear-gradient(
          135deg,
          var(--text-primary) 0%,
          var(--accent-gold) 100%
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      p.subtitle {
        font-size: 1.25rem;
        color: var(--text-secondary);
        max-width: 600px;
        line-height: 1.6;
        margin-bottom: 3rem;
      }
      .metrics {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 2rem;
        width: 100%;
        max-width: 800px;
        margin-bottom: 3rem;
      }
      .metric-card {
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid rgba(212, 175, 55, 0.1);
        padding: 2rem;
        border-radius: 4px;
        backdrop-filter: blur(10px);
      }
      .metric-value {
        font-size: 2.5rem;
        font-weight: 200;
        color: var(--accent-gold);
        margin-bottom: 0.5rem;
      }
      .metric-label {
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--text-secondary);
      }
      .cta {
        padding: 1rem 3rem;
        background: transparent;
        border: 1px solid var(--accent-gold);
        color: var(--accent-gold);
        font-size: 1rem;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      }
      .cta:hover {
        background: var(--accent-gold);
        color: var(--bg-primary);
      }
    </style>
  </head>
  <body>
    <canvas id="canvas-bg"></canvas>
    <div class="container">
      <h1>Aurelius Protocol</h1>
      <p class="subtitle">
        Institutional-grade tokenization and deterministic yield infrastructure
        for sovereign assets.
      </p>
      <div class="metrics">
        <div class="metric-card">
          <div class="metric-value" id="tvl">$0.00</div>
          <div class="metric-label">Total Value Locked</div>
        </div>
        <div class="metric-card">
          <div class="metric-value" id="apy">0.00%</div>
          <div class="metric-label">Weighted APY</div>
        </div>
        <div class="metric-card">
          <div class="metric-value" id="latency">0ms</div>
          <div class="metric-label">Settlement Latency</div>
        </div>
      </div>
      <button class="cta" id="enter-vault">Initialize Vault</button>
    </div>

    <script>
      const canvas = document.getElementById("canvas-bg");
      const ctx = canvas.getContext("2d");
      let width, height, nodes;

      function init() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
        nodes = Array.from({ length: 80 }, () => ({
          x: Math.random() * width,
          y: Math.random() * height,
          vx: (Math.random() - 0.5) * 0.4,
          vy: (Math.random() - 0.5) * 0.4
        }));
      }

      function draw() {
        ctx.fillStyle = "rgba(5, 5, 5, 0.2)";
        ctx.fillRect(0, 0, width, height);

        ctx.fillStyle = "rgba(212, 175, 55, 0.5)";
        nodes.forEach((node) => {
          node.x += node.vx;
          node.y += node.vy;
          if (node.x < 0 || node.x > width) node.vx *= -1;
          if (node.y < 0 || node.y > height) node.vy *= -1;
          ctx.beginPath();
          ctx.arc(node.x, node.y, 1.5, 0, Math.PI * 2);
          ctx.fill();
        });

        ctx.strokeStyle = "rgba(212, 175, 55, 0.05)";
        for (let i = 0; i < nodes.length; i++) {
          for (let j = i + 1; j < nodes.length; j++) {
            const dx = nodes[i].x - nodes[j].x;
            const dy = nodes[i].y - nodes[j].y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 150) {
              ctx.beginPath();
              ctx.moveTo(nodes[i].x, nodes[i].y);
              ctx.lineTo(nodes[j].x, nodes[j].y);
              ctx.stroke();
            }
          }
        }
        requestAnimationFrame(draw);
      }

      window.addEventListener("resize", init);
      init();
      draw();

      const tvlEl = document.getElementById("tvl");
      const apyEl = document.getElementById("apy");
      const latencyEl = document.getElementById("latency");

      let currentTVL = 142500000;
      let currentAPY = 6.84;

      function updateMetrics() {
        currentTVL += (Math.random() - 0.4) * 50000;
        currentAPY += (Math.random() - 0.5) * 0.05;
        const latency = Math.floor(12 + Math.random() * 4);

        tvlEl.textContent = "$" + Math.floor(currentTVL).toLocaleString();
        apyEl.textContent = currentAPY.toFixed(2) + "%";
        latencyEl.textContent = latency + "ms";
      }

      setInterval(updateMetrics, 1500);
      updateMetrics();

      document.getElementById("enter-vault").addEventListener("click", () => {
        console.log("Initializing secure enclave...");
      });
    </script>
  </body>
</html>
